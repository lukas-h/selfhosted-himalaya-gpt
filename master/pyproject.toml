[project]
name = "himalaya-master"
version = "0.1.0"
description = "OpenAI-compatible front door for self-hosted himalayagpt-0.5b-it"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "slowapi>=0.1.9",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]
