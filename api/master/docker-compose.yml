services:
  master:
    build: .
    image: himalaya-master:latest
    container_name: himalaya-master
    restart: unless-stopped
    # Coolify routes traffic via its own Traefik on the docker network and
    # discovers the target port from the application's `ports_exposes`
    # setting. We therefore only `expose:` the port on the docker network
    # and don't publish it on the host. Override locally with `ports:` if
    # you want host-published access.
    expose:
      - "8000"
    environment:
      # Required.
      API_TOKENS: ${API_TOKENS:?set API_TOKENS}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN}
      # Optional knobs are NOT echoed here — pydantic-settings in
      # app/config.py provides the production defaults (rate limit 1200/min
      # + 30/sec burst, queue depth 32, max-concurrent-per-worker 2,
      # user-request timeout 30s, worker-poll timeout 55s, the canonical
      # MODEL_SLUGS list). To override, set the env var directly on the
      # platform (Coolify "Environment Variables" tab, plain `docker run -e`,
      # etc). Echoing them here would pin Coolify to a stale "default" that
      # silently overrides any code change.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
