[project]
name = "himalaya-master"
version = "0.1.0"
description = "OpenAI-compatible front door for self-hosted himalayagpt-0.5b-it"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "slowapi>=0.1.9",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0.3",
    # For api/tests/test_chat_template.py: renders the GGUF-embedded jinja
    # template to verify system-merging + special-token stripping, and
    # parses the GGUF directly to read the embedded template (gguf-py pulls
    # numpy in lazily). All three are dev-only — the runtime master app
    # never touches them.
    "jinja2>=3.1",
    "numpy>=2.0",
]
