version = 1

; Global defaults inherited by every model below.
[*]
ctx-size = 2048
parallel = 2
cont-batching = true
# Full GPU offload via Vulkan (Mesa ANV) on Intel Arc Pro B50.
# The lukas-h/llama.cpp@1be52d2 ggml_cont fix for the gate matmuls is
# still in place; harmless on Vulkan and protects against re-tripping
# the same bug if the backend is swapped.
n-gpu-layers = 999
load-on-startup = true
stop-timeout = 30
flash-attn = on
no-warmup = true

[himalaya-bf16]
model = /models/himalayagpt-0.5b-it-bf16.gguf

[himalaya-q8]
model = /models/himalayagpt-0.5b-it-Q8_0.gguf

[himalaya-q4]
model = /models/himalayagpt-0.5b-it-Q4_K_M.gguf
