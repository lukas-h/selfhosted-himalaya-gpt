version = 1

; Global defaults inherited by every model below.
[*]
ctx-size = 2048
parallel = 1
cont-batching = true
; CPU-only. Switching to a GPU backend (SYCL/Vulkan) here would re-trip the
; multi-child router crash documented in api/worker/docker-compose.yml — every
; child dlopens the GPU backend even with n-gpu-layers=0, and 3 children
; contending over the same device kill themselves silently on prompts >~50
; tokens. Keep at 0 until the deployment moves off router mode.
n-gpu-layers = 0
load-on-startup = true
stop-timeout = 30
; flash-attn=off — the fork's flash-attn path on CPU produces NaN logits and
; spins the sampler in an infinite loop on prompts above a few dozen tokens.
flash-attn = off
no-warmup = true
; The prompt cache's LCP-based prefix reuse hasn't been validated against the
; nanochat compute graph and can wedge the slot on cache restore. Disable.
cache-ram = 0

[himalaya-bf16]
model = /models/himalayagpt-0.5b-it-bf16.gguf

[himalaya-q8]
model = /models/himalayagpt-0.5b-it-Q8_0.gguf

[himalaya-q4]
model = /models/himalayagpt-0.5b-it-Q4_K_M.gguf
