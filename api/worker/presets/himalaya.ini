version = 1

; Global defaults inherited by every model below.
[*]
ctx-size = 2048
parallel = 2
cont-batching = true
# Full GPU offload — fixed by ggml_cont before the gate matmuls in the fork
# (commit 1be52d2 on lukas-h/llama.cpp).
n-gpu-layers = 999
load-on-startup = true
stop-timeout = 30
# Flash-attn ON sidesteps the SYCL ggml_sycl_mul_mat_batched_sycl/to_fp16_nc_sycl
# crash for the K^T·Q attention matmul. We saw a different SYCL crash with
# flash-attn earlier, but that was upstream of the gate-matmul fix; retry now.
flash-attn = on
no-warmup = true

[himalaya-bf16]
model = /models/himalayagpt-0.5b-it-bf16.gguf

[himalaya-q8]
model = /models/himalayagpt-0.5b-it-Q8_0.gguf

[himalaya-q4]
model = /models/himalayagpt-0.5b-it-Q4_K_M.gguf
