version = 1

; Global defaults inherited by every model below.
[*]
ctx-size = 2048
parallel = 1
cont-batching = true
# DEBUG: temporarily CPU-only to isolate whether the crash is SYCL-specific
n-gpu-layers = 0
load-on-startup = true
stop-timeout = 30
flash-attn = off
no-warmup = true

[himalaya-bf16]
model = /models/himalayagpt-0.5b-it-bf16.gguf

[himalaya-q8]
model = /models/himalayagpt-0.5b-it-Q8_0.gguf

[himalaya-q4]
model = /models/himalayagpt-0.5b-it-Q4_K_M.gguf
