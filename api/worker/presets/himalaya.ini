version = 1

; Global defaults inherited by every model below.
[*]
ctx-size = 2048
parallel = 2
cont-batching = true
# CPU-only: the SYCL backend in llama.cpp has multiple latent bugs that
# trigger on this nanochat model:
#   - ggml_sycl_op_mul_mat_sycl/to_fp32_sycl crashes on f16 weight × small K.
#     Worked around in lukas-h/llama.cpp@1be52d2 (ggml_cont) and by re-
#     quantizing the gate weights to f32.
#   - mul_mat_batched_sycl/to_fp16_nc_sycl crashes on the K^T·Q attention
#     matmul. Avoided by flash-attn = on.
#   - With both above mitigations, child instances still crash mid-prompt-
#     eval at n_tokens = 11 (worked at n_tokens = 2). Shape-dependent.
# At 0.5B parameters CPU is the better choice anyway: ~30-100 tok/s on iph4
# vs the 1.84 tok/s we measured during the one successful SYCL generation
# (PCIe round-trips for unsupported ops dominate).
n-gpu-layers = 0
load-on-startup = true
stop-timeout = 30
flash-attn = off
no-warmup = true

[himalaya-bf16]
model = /models/himalayagpt-0.5b-it-bf16.gguf

[himalaya-q8]
model = /models/himalayagpt-0.5b-it-Q8_0.gguf

[himalaya-q4]
model = /models/himalayagpt-0.5b-it-Q4_K_M.gguf
