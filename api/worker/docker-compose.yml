services:
  # One-shot init container: ensures the three GGUFs are present before
  # llama-server starts.
  #
  # The host path below (/home/lukashimsel/himalaya-models) is hardcoded
  # because Coolify's compose parser does NOT do ${VAR} interpolation in
  # `volumes:` lines (it treats anything that doesn't start with /. or / as
  # a Docker named volume). Edit the volume lines if you deploy elsewhere.
  #
  # Behavior at startup:
  #   - If the bind-mount dir already has the .gguf files (e.g. you rsync'd
  #     them there), init exits 0 immediately.
  #   - If files are missing, init installs curl and downloads from
  #     MODELS_DOWNLOAD_BASE_URL.
  models-init:
    image: alpine:3.20
    container_name: himalaya-models-init
    restart: "no"
    environment:
      MODELS_DOWNLOAD_BASE_URL: ${MODELS_DOWNLOAD_BASE_URL:-https://huggingface.co/lukas-h/himalayagpt-0.5b-it-gguf/resolve/main}
      MODELS_FILES: "himalayagpt-0.5b-it-bf16.gguf himalayagpt-0.5b-it-Q8_0.gguf himalayagpt-0.5b-it-Q4_K_M.gguf"
    volumes:
      - /home/lukashimsel/himalaya-models:/models
    command:
      - sh
      - -c
      - |
        set -eu
        echo "[models-init] /models listing (host bind mount visibility):"
        ls -la /models || true
        echo "[models-init] MODELS_FILES=$$MODELS_FILES"
        echo "[models-init] MODELS_DOWNLOAD_BASE_URL=$$MODELS_DOWNLOAD_BASE_URL"
        cd /models
        any_missing=0
        for f in $$MODELS_FILES; do
          if [ -f "$$f" ] && [ -s "$$f" ]; then
            echo "[models-init] $$f present ($$(stat -c %s "$$f") bytes), skip"
            continue
          fi
          any_missing=1
        done
        if [ "$$any_missing" = "0" ]; then
          echo "[models-init] all 3 GGUFs present, nothing to download"
          exit 0
        fi
        echo "[models-init] one or more GGUFs missing, installing curl + downloading"
        apk add --no-cache curl >/dev/null
        for f in $$MODELS_FILES; do
          if [ -f "$$f" ] && [ -s "$$f" ]; then
            continue
          fi
          url="$$MODELS_DOWNLOAD_BASE_URL/$$f"
          echo "[models-init] downloading $$url"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 -o "$$f.partial" "$$url"
          mv "$$f.partial" "$$f"
        done
        echo "[models-init] all models present"

  # ---------------------------------------------------------------
  # Per-quant llama-server containers.
  #
  # Architecture: one container per quant. Two images get built:
  #   - himalaya-llama:cpu (cpu.Dockerfile)  → BF16
  #   - himalaya-llama:sycl (intel.Dockerfile) → Q8_0, Q4_K_M
  #
  # Why mixed:
  #   * BF16 weights aren't fully supported by the SYCL backend — the
  #     model loader splits ~70% of weights to CPU and the resulting
  #     mixed CPU/GPU layout segfaults sched_reserve. CPU is the only
  #     stable home for BF16 right now.
  #   * Q8_0 and Q4_K_M load fully onto the GPU and run at ~1100-1300
  #     tok/s prompt eval and ~350-450 tok/s decode on Arc Pro B50.
  #
  # Why we abandoned the previous router-mode setup:
  #   The fork's `--models-preset` mode spawns one child per model in
  #   the same container. With a GPU-backed binary, each child dlopens
  #   libggml-sycl.so and reserves a SYCL queue on /dev/dri. Two or
  #   more children silently zombie on prompts >~50 tokens because of
  #   the resulting device contention. Per-quant containers each get
  #   their own process tree → no contention.
  #
  # Why --batch-size 8 / --ubatch-size 8 on SYCL:
  #   The fork's flash-attn SYCL kernel hangs and kills the process at
  #   batch.n_tokens > ~10 on this nanochat compute graph. The K^T·Q
  #   strided non-contiguous matmul also crashes when flash-attn is
  #   off, so flash-attn is required. Microbatching keeps every
  #   physical batch under the crash threshold; longer prompts just
  #   loop the kernel more times. Throughput is still GPU-bound.
  # ---------------------------------------------------------------

  llama-bf16:
    build:
      context: ../../llama.cpp
      dockerfile: .devops/cpu.Dockerfile
      target: server
    image: himalaya-llama:cpu
    container_name: himalaya-llama-bf16
    restart: unless-stopped
    depends_on:
      models-init:
        condition: service_completed_successfully
    volumes:
      - /home/lukashimsel/himalaya-models:/models:ro
    environment:
      LLAMA_API_KEY: ${LLAMA_INTERNAL_KEY:?set LLAMA_INTERNAL_KEY}
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--model"
      - "/models/himalayagpt-0.5b-it-bf16.gguf"
      - "--alias"
      - "himalaya-bf16"
      - "--ctx-size"
      - "2048"
      - "--cont-batching"
      - "--flash-attn"
      - "off"
      - "--n-gpu-layers"
      - "0"
      - "--parallel"
      - "1"
      - "--cache-ram"
      - "0"
      - "--no-warmup"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  llama-q8:
    build:
      context: ../../llama.cpp
      dockerfile: .devops/intel.Dockerfile
      target: server
    image: himalaya-llama:sycl
    container_name: himalaya-llama-q8
    restart: unless-stopped
    depends_on:
      models-init:
        condition: service_completed_successfully
    devices:
      - /dev/dri:/dev/dri
    # Numeric GIDs because Docker's `group_add` resolves names against the
    # helper/build container's /etc/group, not the host's. iph4: video=44,
    # render=992. Override via VIDEO_GID / RENDER_GID if your host differs.
    group_add:
      - "${RENDER_GID:-992}"
      - "${VIDEO_GID:-44}"
    volumes:
      - /home/lukashimsel/himalaya-models:/models:ro
    environment:
      LLAMA_API_KEY: ${LLAMA_INTERNAL_KEY:?set LLAMA_INTERNAL_KEY}
      ONEAPI_DEVICE_SELECTOR: level_zero:0
      SYCL_CACHE_PERSISTENT: "1"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--model"
      - "/models/himalayagpt-0.5b-it-Q8_0.gguf"
      - "--alias"
      - "himalaya-q8"
      - "--ctx-size"
      - "2048"
      - "--cont-batching"
      - "--flash-attn"
      - "on"
      - "--batch-size"
      - "8"
      - "--ubatch-size"
      - "8"
      - "--n-gpu-layers"
      - "999"
      - "--parallel"
      - "1"
      - "--cache-ram"
      - "0"
      - "--no-warmup"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 16
      start_period: 90s

  llama-q4:
    build:
      context: ../../llama.cpp
      dockerfile: .devops/intel.Dockerfile
      target: server
    image: himalaya-llama:sycl
    container_name: himalaya-llama-q4
    restart: unless-stopped
    depends_on:
      models-init:
        condition: service_completed_successfully
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-992}"
      - "${VIDEO_GID:-44}"
    volumes:
      - /home/lukashimsel/himalaya-models:/models:ro
    environment:
      LLAMA_API_KEY: ${LLAMA_INTERNAL_KEY:?set LLAMA_INTERNAL_KEY}
      ONEAPI_DEVICE_SELECTOR: level_zero:0
      SYCL_CACHE_PERSISTENT: "1"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--model"
      - "/models/himalayagpt-0.5b-it-Q4_K_M.gguf"
      - "--alias"
      - "himalaya-q4"
      - "--ctx-size"
      - "2048"
      - "--cont-batching"
      - "--flash-attn"
      - "on"
      - "--batch-size"
      - "8"
      - "--ubatch-size"
      - "8"
      - "--n-gpu-layers"
      - "999"
      - "--parallel"
      - "1"
      - "--cache-ram"
      - "0"
      - "--no-warmup"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 16
      start_period: 90s

  agent:
    build: ./agent
    image: himalaya-agent:latest
    container_name: himalaya-agent
    restart: unless-stopped
    depends_on:
      llama-bf16:
        condition: service_healthy
      llama-q8:
        condition: service_healthy
      llama-q4:
        condition: service_healthy
    environment:
      MASTER_BASE_URL: ${MASTER_BASE_URL:?set MASTER_BASE_URL}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN}
      # Per-quant routing. Each slug `himalaya-<quant>` resolves to
      # `http://llama-<quant>:8080` against the compose service names.
      LLAMA_URL_TEMPLATE: http://llama-{quant}:8080
      LLAMA_INTERNAL_KEY: ${LLAMA_INTERNAL_KEY:?set LLAMA_INTERNAL_KEY}
      MODEL_SLUGS: ${MODEL_SLUGS:-himalaya-bf16,himalaya-q8,himalaya-q4}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      POLL_TIMEOUT_S: ${POLL_TIMEOUT_S:-55}
      WORKER_ID: ${WORKER_ID:-arc-pro-b50-01}
