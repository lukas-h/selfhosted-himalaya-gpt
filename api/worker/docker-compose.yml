services:
  # One-shot init container: ensures the three GGUFs are present on the
  # `models` volume before the llama-server starts.
  #
  # Behavior:
  #   - If MODELS_HOST_PATH is set (e.g. /home/lukashimsel/himalaya-models on
  #     iph4), the volume is a bind mount of that path. Files already there →
  #     init runs once, sees them, exits 0 without downloading anything.
  #   - If MODELS_HOST_PATH is NOT set, the volume falls back to a Docker
  #     named volume (himalaya-models-data) that persists across redeploys.
  #     On first boot the init downloads each GGUF from MODELS_DOWNLOAD_BASE_URL.
  #
  # Override MODELS_DOWNLOAD_BASE_URL if you publish the GGUFs somewhere else.
  models-init:
    image: alpine:3.20
    container_name: himalaya-models-init
    restart: "no"
    environment:
      MODELS_DOWNLOAD_BASE_URL: ${MODELS_DOWNLOAD_BASE_URL:-https://huggingface.co/lukas-h/himalayagpt-0.5b-it-gguf/resolve/main}
      MODELS_FILES: "himalayagpt-0.5b-it-bf16.gguf himalayagpt-0.5b-it-Q8_0.gguf himalayagpt-0.5b-it-Q4_K_M.gguf"
    volumes:
      - ${MODELS_HOST_PATH:-himalaya-models-data}:/models
    command:
      - sh
      - -c
      - |
        set -eu
        echo "[models-init] /models listing (host bind mount visibility):"
        ls -la /models || true
        echo "[models-init] MODELS_FILES=$$MODELS_FILES"
        echo "[models-init] MODELS_DOWNLOAD_BASE_URL=$$MODELS_DOWNLOAD_BASE_URL"
        cd /models
        any_missing=0
        for f in $$MODELS_FILES; do
          if [ -f "$$f" ] && [ -s "$$f" ]; then
            echo "[models-init] $$f present ($$(stat -c %s "$$f") bytes), skip"
            continue
          fi
          any_missing=1
        done
        if [ "$$any_missing" = "0" ]; then
          echo "[models-init] all 3 GGUFs present, nothing to download"
          exit 0
        fi
        echo "[models-init] one or more GGUFs missing, will install curl + download"
        apk add --no-cache curl >/dev/null
        for f in $$MODELS_FILES; do
          if [ -f "$$f" ] && [ -s "$$f" ]; then
            continue
          fi
          url="$$MODELS_DOWNLOAD_BASE_URL/$$f"
          echo "[models-init] downloading $$url"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 -o "$$f.partial" "$$url"
          mv "$$f.partial" "$$f"
        done
        echo "[models-init] all models present"

  llama:
    # Builds llama-server from the lukas-h/llama.cpp fork (submodule at
    # ../../llama.cpp) using the fork's own SYCL build path. Without the fork
    # the model would be rejected as `Model NanochatForCausalLM is not supported`.
    build:
      context: ../../llama.cpp
      dockerfile: .devops/intel.Dockerfile
      target: server
      args:
        GGML_SYCL_F16: "OFF"
    image: himalaya-llama:sycl
    container_name: himalaya-llama
    restart: unless-stopped
    depends_on:
      models-init:
        condition: service_completed_successfully
    devices:
      - /dev/dri:/dev/dri
    # Numeric GIDs because Docker's `group_add` resolves names against the
    # helper/build container's /etc/group, not the host's. iph4: video=44,
    # render=992. Override via VIDEO_GID / RENDER_GID if your host differs.
    group_add:
      - "${RENDER_GID:-992}"
      - "${VIDEO_GID:-44}"
    volumes:
      - ${MODELS_HOST_PATH:-himalaya-models-data}:/models:ro
      - ./presets:/presets:ro
    environment:
      LLAMA_API_KEY: ${LLAMA_INTERNAL_KEY:?set LLAMA_INTERNAL_KEY}
      ONEAPI_DEVICE_SELECTOR: level_zero:0
      SYCL_CACHE_PERSISTENT: "1"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--models-preset"
      - "/presets/himalaya.ini"
      - "--models-max"
      - "3"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  agent:
    build: ./agent
    image: himalaya-agent:latest
    container_name: himalaya-agent
    restart: unless-stopped
    depends_on:
      llama:
        condition: service_healthy
    environment:
      MASTER_BASE_URL: ${MASTER_BASE_URL:?set MASTER_BASE_URL}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN}
      LLAMA_BASE_URL: http://llama:8080
      LLAMA_INTERNAL_KEY: ${LLAMA_INTERNAL_KEY:?set LLAMA_INTERNAL_KEY}
      MODEL_SLUGS: ${MODEL_SLUGS:-himalaya-bf16,himalaya-q8,himalaya-q4}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      POLL_TIMEOUT_S: ${POLL_TIMEOUT_S:-55}
      WORKER_ID: ${WORKER_ID:-arc-pro-b50-01}

# Used only when MODELS_HOST_PATH is unset. Persists across redeploys; the
# models-init service populates it on first boot.
volumes:
  himalaya-models-data:
