services:
  # One-shot init container: ensures the three GGUFs are present before
  # llama-server starts.
  #
  # The host path below (/home/lukashimsel/himalaya-models) is hardcoded
  # because Coolify's compose parser does NOT do ${VAR} interpolation in
  # `volumes:` lines (it treats anything that doesn't start with /. or / as
  # a Docker named volume). Edit the two volume lines if you deploy to a
  # different host.
  #
  # Behavior at startup:
  #   - If the bind-mount dir already has the .gguf files (e.g. you rsync'd
  #     them there), init exits 0 immediately.
  #   - If files are missing, init installs curl and downloads from
  #     MODELS_DOWNLOAD_BASE_URL. Override that env to point at your own
  #     mirror / HF repo.
  models-init:
    image: alpine:3.20
    container_name: himalaya-models-init
    restart: "no"
    environment:
      MODELS_DOWNLOAD_BASE_URL: ${MODELS_DOWNLOAD_BASE_URL:-https://huggingface.co/lukas-h/himalayagpt-0.5b-it-gguf/resolve/main}
      MODELS_FILES: "himalayagpt-0.5b-it-bf16.gguf himalayagpt-0.5b-it-Q8_0.gguf himalayagpt-0.5b-it-Q4_K_M.gguf"
    volumes:
      - /home/lukashimsel/himalaya-models:/models
    command:
      - sh
      - -c
      - |
        set -eu
        echo "[models-init] /models listing (host bind mount visibility):"
        ls -la /models || true
        echo "[models-init] MODELS_FILES=$$MODELS_FILES"
        echo "[models-init] MODELS_DOWNLOAD_BASE_URL=$$MODELS_DOWNLOAD_BASE_URL"
        cd /models
        any_missing=0
        for f in $$MODELS_FILES; do
          if [ -f "$$f" ] && [ -s "$$f" ]; then
            echo "[models-init] $$f present ($$(stat -c %s "$$f") bytes), skip"
            continue
          fi
          any_missing=1
        done
        if [ "$$any_missing" = "0" ]; then
          echo "[models-init] all 3 GGUFs present, nothing to download"
          exit 0
        fi
        echo "[models-init] one or more GGUFs missing, installing curl + downloading"
        apk add --no-cache curl >/dev/null
        for f in $$MODELS_FILES; do
          if [ -f "$$f" ] && [ -s "$$f" ]; then
            continue
          fi
          url="$$MODELS_DOWNLOAD_BASE_URL/$$f"
          echo "[models-init] downloading $$url"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 -o "$$f.partial" "$$url"
          mv "$$f.partial" "$$f"
        done
        echo "[models-init] all models present"

  llama:
    # Builds llama-server from the lukas-h/llama.cpp fork (submodule at
    # ../../llama.cpp). CPU-only build — chosen over SYCL/Vulkan because
    # router mode with N≥2 children of a GPU-enabled binary causes silent
    # zombie crashes on prompts >~50 tokens (every child dlopens the GPU
    # backend at startup, contend over /dev/dri at compute-graph alloc).
    # cpu.Dockerfile has no GPU backend baked in → no contention. Without
    # the fork the model would be rejected as `Model NanochatForCausalLM
    # is not supported`. To enable GPU offload later, you'd need to either
    # (a) drop router mode (one container per quant) or (b) wait for an
    # upstream fix to backend-init isolation across child processes.
    build:
      context: ../../llama.cpp
      dockerfile: .devops/cpu.Dockerfile
      target: server
    image: himalaya-llama:cpu
    container_name: himalaya-llama
    restart: unless-stopped
    depends_on:
      models-init:
        condition: service_completed_successfully
    volumes:
      # GGUFs and the preset INI both live in the same bind-mounted dir on
      # the host. Coolify's file_storage rewrite turned `./presets` into an
      # empty managed dir, so we can't use the repo's presets path through
      # the deploy artifact — keep everything in /home/.../himalaya-models.
      - /home/lukashimsel/himalaya-models:/models:ro
    environment:
      LLAMA_API_KEY: ${LLAMA_INTERNAL_KEY:?set LLAMA_INTERNAL_KEY}
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--models-preset"
      - "/models/himalaya.ini"
      # 4 = the three named presets (himalaya-bf16/q8/q4) + the implicit
      # "default" preset created from the [*] global-defaults section.
      - "--models-max"
      - "4"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  agent:
    build: ./agent
    image: himalaya-agent:latest
    container_name: himalaya-agent
    restart: unless-stopped
    depends_on:
      llama:
        condition: service_healthy
    environment:
      MASTER_BASE_URL: ${MASTER_BASE_URL:?set MASTER_BASE_URL}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN}
      LLAMA_BASE_URL: http://llama:8080
      LLAMA_INTERNAL_KEY: ${LLAMA_INTERNAL_KEY:?set LLAMA_INTERNAL_KEY}
      MODEL_SLUGS: ${MODEL_SLUGS:-himalaya-bf16,himalaya-q8,himalaya-q4}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      POLL_TIMEOUT_S: ${POLL_TIMEOUT_S:-55}
      WORKER_ID: ${WORKER_ID:-arc-pro-b50-01}
